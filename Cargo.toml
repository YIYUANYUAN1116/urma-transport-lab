[package]
name = "urma-transport-lab"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Phase 0 skeleton for validating liburma from Rust"
build = "build.rs"
resolver = "2"

[features]
default = []
urma = ["dep:bindgen", "dep:cc"]

[dependencies]
crc32fast = "1.5.0"
sha2 = "0.10.9"

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = { version = "1.2.32", optional = true }
